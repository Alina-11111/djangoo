<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пароль</title>
</head>
<body>
    <h1>Ваш пароль</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>

    {% if succes is True %}
        <p>Поздравляем! Доступ открыт: 📂 Ссылка</p>
    {% elif succes is False %}
         <p style="color: red;">{{ error_message }}</p>
    {% endif %}
</body>
</html>
