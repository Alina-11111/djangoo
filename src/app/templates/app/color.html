<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Цвет текста</title>
</head>
<body>
    <h1>Ваш текст</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>

    {% if user_text is not None %}
        <p style="color: {{ chosen_color }}; font-size: 20px; font-weight: bold;"> {{ user_text }} </p>
    {% endif %}
</body>
</html>
